name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all a check needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The same gate, in the same order, as `cargo xtask ci` runs on a
      # developer's machine: a step added there runs here without anyone
      # having to add it twice. It lints install.sh with shellcheck where
      # shellcheck is installed, which is the Ubuntu image.
      - name: Gate
        run: cargo xtask ci
