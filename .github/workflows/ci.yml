name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all a check needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # The gate's compiler, pinned: each stable release brings lints that
      # `-D warnings` turns into failures, which would turn main red with no
      # change of ours. It moves in a commit that fixes what the new one finds.
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The same gate, in the same order, as `cargo xtask ci` runs on a
      # developer's machine: a step added there runs here without anyone
      # having to add it twice. It lints install.sh with shellcheck, which
      # `CI` makes mandatory, so the step below installs it where an image
      # lacks it.
      - name: Install shellcheck where the image lacks it
        run: command -v shellcheck || { if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get install -y shellcheck; fi; }

      - name: Gate
        run: cargo xtask ci

  # The manifest's `rust-version` is a promise to anyone building from
  # source: the oldest compiler the workspace builds on. The gate builds on
  # a recent stable only, so without this a dependency or a language feature that
  # needs a newer one makes the promise false without anything failing.
  rust-version:
    name: rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the toolchain the manifest names
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          echo "RUST_VERSION=$version" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Tests, not only a check: a test that uses a newer standard library
      # item compiles on stable and is what the promise breaks on.
      - name: Test on it
        run: cargo +"$RUST_VERSION" test --workspace
