name: Friction
description: One thing that made you reach for plain `claude` instead.
labels: [friction]
body:
  - type: textarea
    id: moment
    attributes:
      label: The moment
      description: What you were trying to do, and what you did instead.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What would have kept you in Niobe
      description: One sentence is plenty.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `niobe doctor --json`, if it may matter
      render: json
