[package]
name = "niobe-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The terminal UI. Consumes the shared event model and nothing backend-specific."

[dependencies]
niobe-core.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true
# `poll(2)`, for the wait that notices a terminal that has gone away.
rustix = { workspace = true, features = ["event"] }

[target.'cfg(unix)'.dev-dependencies]
# A pty to wait on, so that a hangup is tested against a real terminal.
rustix = { workspace = true, features = ["event", "pty"] }

[lints]
workspace = true
