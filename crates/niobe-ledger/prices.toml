# The prices Niobe computes API-equivalent costs from.
#
# Every rate is in USD per million tokens, as the provider publishes it:
#
#   input           input tokens neither read from nor written to the cache
#   output          output tokens; reasoning tokens are billed at this rate
#   cache_read      input tokens read from the prompt cache
#   cache_write     input tokens written to the cache for the default lifetime
#   cache_write_1h  input tokens written to the cache for an hour, where the
#                   provider offers it; without it, a record with one-hour
#                   writes is unpriced
#
# A `[model.price.long_context]` table replaces all of those rates for a
# request whose prompt, cached tokens included, is longer than `above` tokens.
#
# `ids` are matched exactly against the model a backend reports. An id that is
# not listed is unpriced; nothing is inferred from a near match.
#
# Each price is in force from its `from` date (UTC) until the next one. That is
# what lets a session be priced at the rates of the day it ran. A date is the
# day the price is first known to have applied: the model's release, or the
# day a change was announced to take effect. A session from before a model's
# first date is unpriced.
#
# To override, put a file of the same shape at ~/.config/niobe/prices.toml
# ($XDG_CONFIG_HOME/niobe/prices.toml when that is set). Every id it lists
# replaces that id's whole schedule here.

# Anthropic, the Claude API.
#
# https://platform.claude.com/docs/en/about-claude/pricing for the rates,
# https://platform.claude.com/docs/en/release-notes/overview for the dates they
# changed on, and each model's page for its release date. The `[1m]` ids are
# the spelling Claude Code uses for a model with its 1M-token window selected;
# they are listed only for models whose window is billed at standard rates, or
# where the long-context rates say what it costs.

# Claude Fable 5.1
[[model]]
ids = [
    "claude-fable-5-1",
    "claude-fable-5-1[1m]",
]

[[model.price]]
from = 2026-09-01
input = 10.00
output = 50.00
cache_read = 0.25
cache_write = 12.50
cache_write_1h = 20.00

