# Amazon Bedrock, Anthropic models.
#
# https://aws.amazon.com/bedrock/pricing/ for the rates, read from AWS's price
# list for EU (Ireland) and US East (N. Virginia), which agree. A geographic
# profile (`eu.`, `us.`) routes within a region group and is billed at the
# global rate plus 10%; a `global.` profile is billed at the global rate. A bare
# `anthropic.` id is not listed: whether it is billed at the global or the
# regional rate depends on the endpoint it is sent to, which the id does not
# say. Profile ids are documented at
# https://platform.claude.com/docs/en/build-with-claude/claude-on-amazon-bedrock-legacy
# for models on the InvokeModel integration.
#
# The rates of every model below were unchanged in each copy of AWS's price
# list on record between the model's first appearance in it and September
# 2026. Opus 4.6 and Sonnet 4.6 start at 13 March 2026, when their 1M window
# came to standard pricing: what Bedrock billed a long prompt before that is
# not on record here. Claude Fable 5.1 is not listed: its only regional
# endpoint is in us-east-1, and no profile id for it is documented.

# Claude Fable 5, EU and US geographic profiles
[[model]]
ids = [
    "eu.anthropic.claude-fable-5",
    "eu.anthropic.claude-fable-5[1m]",
    "us.anthropic.claude-fable-5",
    "us.anthropic.claude-fable-5[1m]",
]

[[model.price]]
from = 2026-06-09
input = 11.00
output = 55.00
cache_read = 1.10
