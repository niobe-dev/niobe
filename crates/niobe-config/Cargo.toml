[package]
name = "niobe-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Niobe's configuration: profiles, each a backend plus the environment and arguments it runs with."

[dependencies]
niobe-core.workspace = true
toml.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# `flock(2)` on the directory a rule is written into, so two sessions adding
# rules at once do not lose one.
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
