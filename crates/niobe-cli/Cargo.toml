[package]
name = "niobe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Niobe — a terminal coding agent that keeps you aware of what is being built and how, from each decision to what it cost."

[[bin]]
name = "niobe"
path = "src/main.rs"

[dependencies]
niobe-core.workspace = true
niobe-ledger.workspace = true
niobe-config.workspace = true
niobe-store.workspace = true
niobe-tui.workspace = true
niobe-bridge-claude.workspace = true
niobe-bridge-codex.workspace = true

# The `claude` CLI's own settings file, read to say what a profile that names
# none is running under. One key of it; nothing is written.
serde_json.workspace = true

[dev-dependencies]
# The shell's key events are ratatui's; the tests drive the shell with them.
ratatui.workspace = true
tempfile.workspace = true
# The checksum a fake release is published with, computed apart from the
# `shasum` / `sha256sum` the installer verifies it with.
sha2.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# A pty to run the binary on, for the tests that take its terminal away, and
# `kill` for the one that asks it to stop.
rustix = { workspace = true, features = ["event", "process", "pty", "termios"] }

[lints]
workspace = true
