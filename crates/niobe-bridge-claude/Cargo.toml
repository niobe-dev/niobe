[package]
name = "niobe-bridge-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Drives the official `claude` CLI as a subprocess and translates its output into the shared event model."

[dependencies]
niobe-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Ending what the CLI started along with it as a session closes: its process
# group is signalled, which std cannot do.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
