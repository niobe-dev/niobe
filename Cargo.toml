[workspace]
resolver = "3"
members = [
    "crates/niobe-core",
    "crates/niobe-ledger",
    "crates/niobe-config",
    "crates/niobe-store",
    "crates/niobe-tui",
    "crates/niobe-bridge-claude",
    "crates/niobe-bridge-codex",
    "crates/niobe-cli",
    "xtask",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/niobe-dev/niobe"
authors = ["Viacheslav Shynkarenko"]

[workspace.dependencies]
niobe-core = { path = "crates/niobe-core", version = "0.6.0" }
niobe-ledger = { path = "crates/niobe-ledger", version = "0.6.0" }
niobe-config = { path = "crates/niobe-config", version = "0.6.0" }
niobe-store = { path = "crates/niobe-store", version = "0.6.0" }
niobe-tui = { path = "crates/niobe-tui", version = "0.6.0" }
niobe-bridge-claude = { path = "crates/niobe-bridge-claude", version = "0.6.0" }
niobe-bridge-codex = { path = "crates/niobe-bridge-codex", version = "0.6.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The session store. `bundled` compiles SQLite into the binary, so the store
# behaves the same on every machine instead of on whatever libsqlite3 the
# system ships, and a Linux build needs no -dev package.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"

# The config file. Only the parser: the config is walked by hand from the
# spanned document rather than deserialized, so an invalid file is reported as
# the key and the line it is on instead of as a serde error, and serde's
# TOML deserializer is not compiled in.
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }

# The digest a trust record is kept by. A repository's config arrives with a
# clone, so the operator's decision to trust one has to be attached to the
# bytes they read: an attacker who can rewrite that file picks both contents,
# which is exactly what a cryptographic hash is needed for and what a checksum
# would not survive.
sha2 = { version = "0.10", default-features = false }

# The TUI stack. `ratatui-textarea` is the composer widget: it is the same
# editor as `tui-textarea`, maintained by the ratatui org against ratatui 0.30,
# whereas the upstream crate's latest release still pins ratatui 0.29.
ratatui = "0.30"
ratatui-textarea = "0.9"
unicode-width = "0.2"
signal-hook = "0.4"

# Safe wrappers for the POSIX calls the workspace needs — `unsafe` is denied,
# so the raw ones are not an option. The event loop waits with `poll(2)`, and
# the CLI's tests drive the binary through a pty.
rustix = "1.1"

# The wall clock the shell shows, and the local offset it needs to be a wall
# clock rather than UTC. Reading `/etc/localtime` and applying the right
# transition is the tzdb's job, not a thing to hand-roll: an offset guessed
# from `TZ` is wrong across a DST boundary, and a clock that is an hour out is
# worse than no clock. Only what that needs: no serde, and no bundled database
# — the system's own is read, and where there is none the shell draws no time.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

# The assistant's replies are CommonMark, and the transcript draws them styled.
# Only the parser: the default features add an HTML renderer and a command
# line's option parser, neither of which the shell uses.
pulldown-cmark = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Denied in CI with `-D warnings`; kept as warnings locally so a work in
# progress still compiles.
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Library and binary code propagates errors; `clippy.toml` allows both in
# tests, where a failed expectation is the point.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# The release binary has a 20 MB budget (`cargo xtask size`), so the release
# profile carries the size settings from the start rather than being tuned
# once the binary is already too big.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set: the terminal must be restored on
# a panic, and the restore guard is a Drop impl, which only runs while panics
# unwind.
panic = "unwind"
